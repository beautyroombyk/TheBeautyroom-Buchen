function fmtDate(iso){const d=new Date(iso);return d.toLocaleDateString('de-CH',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'})}

function dpad(n){return String(n).padStart(2,'0')}
function toDateStr(d){return d.getFullYear()+'-'+dpad(d.getMonth()+1)+'-'+dpad(d.getDate())}

function calendarHtml(){
  const y=calMonth.getFullYear(),m=calMonth.getMonth();
  const first=new Date(y,m,1);
  const startOffset=(first.getDay()+6)%7; // Montag=0
  const daysInMonth=new Date(y,m+1,0).getDate();
  const todayStr=toDateStr(new Date());
  const activeBookings=bookings.filter(b=>b.status!=='cancelled');
  const byDate={};
  activeBookings.forEach(b=>{const ds=bookingDateStr(b);(byDate[ds]=byDate[ds]||[]).push(b)});
  Object.values(byDate).forEach(arr=>arr.sort((a,b)=>new Date(a.start_at)-new Date(b.start_at)));
  const monthNames=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  const dows=['Mo','Di','Mi','Do','Fr','Sa','So'];
  const maxChips=2;
  let cells='';
  for(let i=0;i<startOffset;i++)cells+=`<div class='cal-day empty'></div>`;
  for(let day=1;day<=daysInMonth;day++){
    const ds=y+'-'+dpad(m+1)+'-'+dpad(day);
    const dayBookings=byDate[ds]||[];
    const cls=['cal-day'];
    if(ds===todayStr)cls.push('today');
    if(ds===selectedDate)cls.push('sel');
    const dayBlocks=blocked.filter(r=>ds>=r.start_date&&ds<=r.end_date);
    if(dayBlocks.length)cls.push('blocked');
    const items=[
      ...dayBlocks.map(r=>`<div class='cal-chip block'>${r.start_time?r.start_time.slice(0,5)+' ':''}${r.reason||'Gesperrt'}</div>`),
      ...dayBookings.map(b=>{const cust=b.customers?b.customers.first_name:'';return `<div class='cal-chip'>${fmtTime(b.start_at)} ${cust}</div>`})
    ];
    const chips=items.slice(0,maxChips).join('');
    const more=items.length>maxChips?`<div class='cal-more'>+${items.length-maxChips} mehr</div>`:'';
    cells+=`<div class='${cls.join(' ')}' onclick="selectDay('${ds}')"><span class='daynum'>${day}</span>${chips}${more}</div>`
  }
  return `<div class='calendar'>
    <div class='cal-head'><button onclick='changeMonth(-1)'>‹</button><b>${monthNames[m]} ${y}</b><button onclick='changeMonth(1)'>›</button></div>
    <div class='cal-grid'>${dows.map(d=>`<div class='cal-dow'>${d}</div>`).join('')}${cells}</div>
    ${selectedDate!==todayStr?`<div class='clear-filter' style='margin-bottom:0'><a href='#' onclick='goToday();return false'>Heute</a></div>`:''}
  </div>`
}

// Admin darf IMMER buchen (auch gesperrte Zeiten, Sonntag, am gleichen Tag, weniger als 24h vorher).
// Gesperrte/belegte Zeiten werden nur markiert, nicht ausgeblendet.
function manualTimes(dateStr){
  if(!dateStr)return[];
  const d=new Date(dateStr+'T12:00:00');
  const bizEnd=d.getDay()===0?0:(d.getDay()===6?15*60:20*60);
  const dur=manualDuration()||(editing?editing.dur:30);
  const dayBlocks=blocked.filter(r=>dateStr>=r.start_date&&dateStr<=r.end_date);
  const wholeBlocked=dayBlocks.some(r=>!r.start_time);
  const windows=dayBlocks.filter(r=>r.start_time).map(r=>{
    const [sh,sm]=r.start_time.split(':').map(Number);
    const [eh,em]=r.end_time.split(':').map(Number);
    return [sh*60+sm,eh*60+em]
  });
  const busy=bookings.filter(b=>b.status!=='cancelled'&&bookingDateStr(b)===dateStr&&!(editing&&b.id===editing.id)).map(b=>{
    const s=new Date(b.start_at),e=new Date(b.end_at);
    return [s.getHours()*60+s.getMinutes(),e.getHours()*60+e.getMinutes()]
  });
  let a=[];
  for(let m=6*60;m+dur<=24*60;m+=30){
    let note='';
    if(wholeBlocked||windows.some(([bs,be])=>m<be&&m+dur>bs))note='gesperrt';
    else if(busy.some(([bs,be])=>m<be&&m+dur>bs))note='belegt';
    else if(m<9*60||m+dur>bizEnd)note='ausserhalb Öffnungszeiten';
    a.push({t:manualPad(Math.floor(m/60))+':'+manualPad(m%60),note})
  }
  return a
}

function manualPrice(){return manualCart.reduce((sum,c)=>{const s=services[c.i];return sum+Number(s.price_chf)+(c.addon?Number(s.addon_price_chf)||0:0)},0)}
function manualLabel(){return manualCart.map(c=>{const s=services[c.i];return s.name+(c.addon?' + '+s.addon_name:'')}).join(', ')}

async function addManualBooking(){
  const first=manualFirst.trim();
  const last=manualLast.trim();
  const phone=manualPhone.trim();

  const time=manualTime;

  if(!date||!time)return alert('Bitte Datum und Uhrzeit eingeben.');
  if(!manualCart.length)return alert('Bitte mindestens eine Behandlung auswählen.');
  if(phone&&!/^\+[1-9]\d{6,14}$/.test(phone))return alert('Bitte Handynummer im Format +41791234567 eingeben (oder leer lassen).');
  const dur=manualDuration(),price=manualPrice(),label=manualLabel();
  const primaryServiceId=services[manualCart[0].i].id;
  const startAt=new Date(date+'T'+time+':00');
  const endAt=new Date(startAt.getTime()+dur*60000);
  const slotInfo=manualTimes(date).find(x=>x.t===time);
  if(slotInfo&&slotInfo.note==='gesperrt'&&!confirm('Achtung: Diese Zeit ist im Admin-Bereich gesperrt (z.B. Ferien). Trotzdem einen Termin eintragen?'))return;
  try{
    const {data:existing,error:eCheck}=await supa.from('bookings').select('id,start_at,end_at').neq('status','cancelled').gte('start_at',date+'T00:00:00').lte('start_at',date+'T23:59:59');
    if(eCheck)throw eCheck;
    const overlap=(existing||[]).some(b=>{const bs=new Date(b.start_at),be=new Date(b.end_at);return startAt<be&&endAt>bs});
    if(overlap&&!confirm('Achtung: In diesem Zeitraum existiert bereits ein Termin. Trotzdem speichern?'))return;
    const {data:cust,error:e1}=await supa.from('customers').insert({first_name:first,last_name:last,phone:phone||null}).select().single();
    if(e1)throw e1;
    const {error:e2}=await supa.from('bookings').insert({customer_id:cust.id,service_id:primaryServiceId,start_at:startAt.toISOString(),end_at:endAt.toISOString(),total_price_chf:price,status:'confirmed',source:'manual',customer_note:'Manuell erfasst (z.B. Instagram): '+label});
    if(e2)throw e2;
  }catch(err){console.error(err);alert('Fehler beim Speichern: '+(err.message||''));return}
  const freundinMsg=`Neue Buchung (manuell): ${first} ${last} am ${date} um ${time} (${label}). Adresse: ${STUDIO_ADDRESS}`;
  const smsJobs=[sendSms(FRIEND_PHONE,freundinMsg)];
  if(phone){
    const kundeMsg=`Hallo ${first}, dein Termin am ${date} um ${time} bei THE BEAUTY ROOM BY K ist bestätigt. Adresse: ${STUDIO_ADDRESS}`;
    smsJobs.push(sendSms(phone,kundeMsg))
  }
  await Promise.allSettled(smsJobs);
  manualCart=[];manualFirst='';manualLast='';manualPhone='';manualDate='';manualTime='';
  await loadBookings();
  alert('Termin wurde erfasst und ist jetzt im Online-Buchungssystem automatisch gesperrt.'+(phone?' SMS-Bestätigung wurde verschickt.':' (Keine Handynummer angegeben, keine SMS an Kundin verschickt.)'));
  tab='bookings';renderApp()
}

function startEdit(id){
  const b=bookings.find(x=>x.id===id);if(!b)return;
  const s=new Date(b.start_at),e=new Date(b.end_at);
  editing={id:b.id,customerId:b.customer_id,serviceId:b.service_id,svcName:b.services?.name||'',dur:Math.round((e-s)/60000),price:b.total_price_chf,note:b.customer_note||'',first:b.customers?.first_name||'',last:b.customers?.last_name||'',phone:b.customers?.phone||''};
  manualCart=[];
  manualFirst=editing.first;manualLast=editing.last;manualPhone=editing.phone;
  manualDate=bookingDateStr(b);
  manualTime=manualPad(s.getHours())+':'+manualPad(s.getMinutes());
  tab='manual';renderApp();window.scrollTo(0,0)
}
function cancelEdit(){
  editing=null;manualCart=[];manualFirst='';manualLast='';manualPhone='';manualDate='';manualTime='';
  tab='bookings';renderApp()
}
async function saveEditedBooking(){
  if(!editing)return;
  const first=manualFirst.trim(),last=manualLast.trim(),phone=manualPhone.trim();
  const date=manualDate,time=manualTime;
  if(!first||!last)return alert('Bitte Vor- und Nachname eingeben.');
  if(!date||!time)return alert('Bitte Datum und Uhrzeit eingeben.');
  if(phone&&!/^\+[1-9]\d{6,14}$/.test(phone))return alert('Bitte Handynummer im Format +41791234567 eingeben (oder leer lassen).');
  const changedSvc=manualCart.length>0;
  const dur=changedSvc?manualDuration():editing.dur;
  const price=changedSvc?manualPrice():editing.price;
  const serviceId=changedSvc?services[manualCart[0].i].id:editing.serviceId;
  const label=changedSvc?manualLabel():editing.svcName;
  const note=changedSvc?((editing.note?editing.note+' | ':'')+'Behandlung geändert: '+label):editing.note;
  const startAt=new Date(date+'T'+time+':00');
  const endAt=new Date(startAt.getTime()+dur*60000);
  const slotInfo=manualTimes(date).find(x=>x.t===time);
  if(slotInfo&&slotInfo.note==='gesperrt'&&!confirm('Achtung: Diese Zeit ist im Admin-Bereich gesperrt (z.B. Ferien). Trotzdem verschieben?'))return;
  try{
    const {data:existing,error:eCheck}=await supa.from('bookings').select('id,start_at,end_at').neq('status','cancelled').neq('id',editing.id).gte('start_at',date+'T00:00:00').lte('start_at',date+'T23:59:59');
    if(eCheck)throw eCheck;
    const overlap=(existing||[]).some(b=>{const bs=new Date(b.start_at),be=new Date(b.end_at);return startAt<be&&endAt>bs});
    if(overlap&&!confirm('Achtung: In diesem Zeitraum existiert bereits ein Termin. Trotzdem speichern?'))return;
    if(first!==editing.first||last!==editing.last||phone!==editing.phone){
      const {data:cu,error:e1}=await supa.from('customers').update({first_name:first,last_name:last,phone:phone||null}).eq('id',editing.customerId).select();
      if(e1)throw e1;
      if(!cu||!cu.length)throw new Error('Kundendaten konnten nicht geändert werden (fehlende Berechtigung in Supabase, siehe fix_update_customers.sql).');
    }
    const {data:bu,error:e2}=await supa.from('bookings').update({service_id:serviceId,start_at:startAt.toISOString(),end_at:endAt.toISOString(),total_price_chf:price,customer_note:note}).eq('id',editing.id).select();
    if(e2)throw e2;
    if(!bu||!bu.length)throw new Error('Termin konnte nicht geändert werden (fehlende Berechtigung in Supabase).');
  }catch(err){console.error(err);alert('Fehler beim Speichern: '+(err.message||''));return}
  let smsSent=false;
  if(phone&&confirm('Termin wurde geändert. Kundin per SMS über den neuen Termin informieren?')){
    await sendSms(phone,`Hallo ${first}, dein Termin bei THE BEAUTY ROOM BY K wurde geändert: neu am ${date} um ${time}. Adresse: ${STUDIO_ADDRESS}`);
    smsSent=true
  }
  editing=null;manualCart=[];manualFirst='';manualLast='';manualPhone='';manualDate='';manualTime='';
  await loadBookings();
  selectedDate=date;calMonth=new Date(startAt.getFullYear(),startAt.getMonth(),1);
  tab='bookings';renderApp();
  alert('Termin wurde geändert.'+(smsSent?' SMS wurde verschickt.':''))
}

function manualHtml(){
  const cats=[...new Set(services.map(s=>s.category))];
  return `
    <h2>${editing?'Termin ändern':'Manuelle Buchung erfassen'}</h2>
    ${editing?`<div class='note' style='margin:-4px 0 14px'>Ändere Name, Handynummer, Datum oder Uhrzeit. Die Behandlung bleibt <b>${editing.svcName||'unverändert'}</b> (${editing.dur} Min.), ausser du wählst unten andere Behandlungen aus.</div>`:`<div class='note' style='margin:-4px 0 14px'>Für Kundinnen, die z.B. per Instagram-DM buchen. Die Zeit wird danach automatisch im Online-Buchungssystem gesperrt, damit niemand doppelt buchen kann.</div>`}
    <div class='row2'>
      <div class='field'><label>Vorname *</label><input type='text' id='m_first' value='${manualFirst}' oninput='setManualFirst(this.value)'></div>
      <div class='field'><label>Nachname *</label><input type='text' id='m_last' value='${manualLast}' oninput='setManualLast(this.value)'></div>
    </div>
    <div class='field'><label>Handynummer (optional)</label><input type='tel' id='m_phone' value='${manualPhone}' oninput='setManualPhone(this.value)' placeholder='+41791234567'></div>
    <div class='field'><label>Datum *</label><input type='date' id='m_date' value='${manualDate}' onchange='setManualDate(this.value)'></div>
    <h3>Behandlung(en) auswählen</h3>
    ${cats.map(cat=>`
      <div style='margin:10px 0 4px'><b style='font-size:13px;color:var(--muted)'>${cat}</b></div>
      ${services.filter(s=>s.category===cat).map(s=>{
        const i=services.indexOf(s);
        const item=manualCart.find(c=>c.i===i);
        const row=`<div class='service-item' style='cursor:pointer' onclick='manualToggleItem(${i})'>
          <div><b>${item?'✓ ':''}${s.name}</b><small>${s.duration_minutes} Min. · CHF ${s.price_chf}</small></div>
        </div>`;
        const addonRow=(item&&s.addon_name)?`<div class='service-item' style='margin:0 0 8px 20px;cursor:pointer;background:#fbf5ec' onclick='manualToggleAddon(${i})'>
          <div><small>${item.addon?'✓ ':''}+ ${s.addon_name} (${s.addon_duration_minutes} Min.)</small></div>
          <div><small>+CHF ${s.addon_price_chf}</small></div>
        </div>`:'';
        return row+addonRow
      }).join('')}
    `).join('')}
    ${manualCart.length?`<div class='note' style='margin:12px 0;font-size:14px'><b>${manualLabel()}</b><br>${manualDuration()} Min. · CHF ${manualPrice()}</div>`:''}
    <div class='field'><label>Uhrzeit *</label>
      ${!manualDate?`<div class='note' style='margin-top:0'>Bitte zuerst ein Datum wählen.</div>`:
        (manualTimes(manualDate).length?`<select id='m_time' onchange='setManualTime(this.value)'>
          <option value=''>Bitte wählen...</option>
          ${manualTimes(manualDate).map(x=>`<option value='${x.t}' ${manualTime===x.t?'selected':''}>${x.t}${x.note?' ('+x.note+')':''}</option>`).join('')}
        </select><div class='note'>Als Admin kannst du jede Zeit wählen (ab 06:00), auch ausserhalb der Öffnungszeiten, am gleichen Tag, bei gesperrten Zeiten oder am Sonntag.</div>`:`<div class='note' style='margin-top:0'>Für diese Dauer passt keine Zeit mehr in diesen Tag.</div>`)}
    </div>
    ${editing?`<button class='primary' onclick='saveEditedBooking()'>Änderungen speichern</button><div class='clear-filter'><a href='#' onclick='cancelEdit();return false'>Abbrechen</a></div>`:`<button class='primary' onclick='addManualBooking()'>Termin erfassen & sperren</button>`}
  `
}

function servicesHtml(){
  return `
    <h2>Neue Behandlung hinzufügen</h2>
    <div class='field'><label>Kategorie (z.B. Brows, Lashes, Nails)</label><input type='text' id='s_category' list='cat_list'><datalist id='cat_list'>${[...new Set(services.map(s=>s.category))].map(c=>`<option value='${c}'>`).join('')}</datalist></div>
    <div class='field'><label>Name der Behandlung</label><input type='text' id='s_name'></div>
    <div class='row2'>
      <div class='field'><label>Dauer (Min.)</label><input type='number' id='s_duration'></div>
      <div class='field'><label>Preis (CHF)</label><input type='number' step='0.01' id='s_price'></div>
    </div>
    <div class='checkbox-row'><input type='checkbox' id='addon_check' onchange='toggleNewAddon()' ${newAddon?'checked':''}><label for='addon_check' style='margin:0'>Optionale Zusatzoption anbieten</label></div>
    ${newAddon?`
      <div class='field'><label>Name der Zusatzoption (z.B. Färben)</label><input type='text' id='s_addon_name'></div>
      <div class='row2'>
        <div class='field'><label>Zusatz-Dauer (Min.)</label><input type='number' id='s_addon_duration'></div>
        <div class='field'><label>Zusatz-Preis (CHF)</label><input type='number' step='0.01' id='s_addon_price'></div>
      </div>
    `:''}
    <button class='primary' onclick='addService()'>Behandlung hinzufügen</button>
    <hr class='divider'>
    <h2>Bestehende Behandlungen</h2>
    ${services.length?services.map(s=>`
      <div class='service-item'>
        <div><b>${s.name}</b><small>${s.category} · ${s.duration_minutes} Min. · CHF ${s.price_chf}${s.addon_name?` · +${s.addon_name} (${s.addon_duration_minutes} Min., CHF ${s.addon_price_chf})`:''}</small>${!s.active?`<small style='color:#a44'>deaktiviert</small>`:''}</div>
        <div style='display:flex;flex-direction:column;gap:6px;align-items:end'>
          <button class='del-btn' onclick='toggleServiceActive("${s.id}",${s.active})'>${s.active?'Deaktivieren':'Aktivieren'}</button>
          <button class='del-btn' onclick='deleteService("${s.id}")'>Löschen</button>
        </div>
      </div>
    `).join(''):`<div class='empty'>Noch keine Behandlungen.</div>`}
  `
}

function renderApp(){
  app.innerHTML=`
    <section class='card'>
      <div class='tabs'>
        <div class='tab ${tab==='bookings'?'active':''}' onclick='tab="bookings";renderApp()'>Buchungen</div>
        <div class='tab ${tab==='manual'?'active':''}' onclick='tab="manual";renderApp()'>Manuell buchen</div>
        <div class='tab ${tab==='blocked'?'active':''}' onclick='tab="blocked";renderApp()'>Tage sperren</div>
        <div class='tab ${tab==='services'?'active':''}' onclick='tab="services";renderApp()'>Angebot</div>
      </div>
      ${tab==='bookings'?bookingsHtml():tab==='manual'?manualHtml():tab==='blocked'?blockedHtml():servicesHtml()}
      <div class='note' style='text-align:center;margin-top:20px'><a href='#' onclick='logout();return false' style='color:var(--muted)'>Abmelden</a></div>
    </section>
  `
}

async function render(){
  if(!isLoggedIn()){
    app.innerHTML=`<section class='card'>
      <h2>Anmelden</h2>
      <div class='field'><label>Passwort</label><input type='password' id='pw'></div>
      <button class='primary' onclick='login()'>Anmelden</button>
    </section>`;
    return
  }
  app.innerHTML=`<div class='empty'>Lädt...</div>`;
  await Promise.all([loadBookings(),loadBlocked(),loadServices()]);
  renderApp()
}
render();
</script></body></html>
